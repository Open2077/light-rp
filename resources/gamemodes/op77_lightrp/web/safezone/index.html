<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Safe zone</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- The safe-zone tile (client/core/safezone_tile.lua): a green holographic square on the
       voice plate's top-left corner, in the voice plate's projection. Entering a zone, the
       label unfolds out of it and folds back; leaving, it unfolds in amber, then the tile goes.
       Plain page, outside the React bundle, on its own small surface. -->
  <div id="zone" class="zone" aria-live="polite">
    <div class="zone__rig">
      <div class="zone__plane">
        <div class="zone__haze"></div>
        <div class="zone__holo">
          <div class="zone__tile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.3 7.5 10 4.3-1.7 7.5-5.4 7.5-10v-6Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
          </div>
          <div class="zone__label">
            <b id="title" class="zone__title"></b>
            <span id="hint" class="zone__hint"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
