<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Speedometer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- The holographic speedometer. #stage is placed at the bottom right (right/bottom
       and scale from the config), #rig carries the high-speed shake, #plane the 3D tilt
       and the enter/exit animations, #holo the glow, scanlines and flicker. Everything
       inside is laid out on a flat 420 x 232 px plane. -->
  <div id="stage" class="stage" aria-hidden="true">
    <div id="rig" class="rig">
      <div id="plane" class="plane">
        <div class="haze"></div>
        <div id="holo" class="holo">
          <i class="corner corner--tl"></i><i class="corner corner--tr"></i><i class="corner corner--bl"></i><i class="corner corner--br"></i>

          <div class="name"><b></b><span id="name">VEHICLE</span></div>

          <div class="rpm">
            <div id="rpm" class="rpm__cells"></div>
            <span class="rpm__label">RPM</span>
          </div>

          <div class="readout">
            <svg id="digits" class="digits" viewBox="0 0 228 112" width="228" height="112"></svg>
            <div class="tags">
              <span id="tagHbk" class="tag tag--warn">HBK</span>
              <span id="tagAbs" class="tag">ABS</span>
              <span id="tagTcs" class="tag">TCS</span>
            </div>
            <div class="gauges">
              <div id="fuelGauge" class="vgauge vgauge--fuel" title="Fuel"><div class="vgauge__cells"></div><svg viewBox="0 0 24 24"><path d="M4 21V5l2-2h7l2 2v16M3 21h13M7 8h5"/><path d="M15 10h2l2 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg></div>
              <div id="condGauge" class="vgauge vgauge--cond" title="Condition"><div class="vgauge__cells"></div><svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0 5 5L21 13l-8 8-4-4 8-8M9.5 17.5 4 23M14.5 6.5 13 5l3-3 2 1"/></svg></div>
            </div>
          </div>

          <div class="sub">
            <span id="gear" class="gear"><small>GEAR</small><b id="gearValue">N</b></span>
            <span id="unit" class="unit">KPH</span>
            <span class="icons">
              <span id="icoLights" class="ico" title="Lights"><svg viewBox="0 0 24 24"><path d="M10 6c-4 0-6 2.6-6 6s2 6 6 6c1.5 0 2-1 2-6s-.5-6-2-6Z"/><path d="M15 8h6M15 12h6M15 16h6"/></svg></span>
              <span id="icoEngine" class="ico" title="Engine"><svg viewBox="0 0 24 24"><path d="M7 8h7l2 2h3v3h2v-2M19 13v3h-3l-2 2H8l-2-2H3v-6h2V8h2Z"/><path d="M9 5h5M11.5 5v3"/></svg></span>
              <span id="icoTires" class="ico" title="Tyres"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v5M12 15v5M4 12h5M15 12h5"/></svg><em id="tireCount"></em></span>
            </span>
          </div>

          <div class="bar">
            <div class="bar__track"></div>
            <div id="barFill" class="bar__fill"></div>
            <div id="barHead" class="bar__head"></div>
            <div id="barTicks" class="bar__ticks"></div>
          </div>

          <div class="sweep"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
