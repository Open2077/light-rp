<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Races</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Race HUD: top right while racing (course, clock, checkpoints, lap, place). -->
  <section id="hud" class="hud" hidden>
    <header class="hud__head">
      <span id="hudMode" class="tag">TIME TRIAL</span>
      <span id="hudCourse" class="hud__course">Course</span>
    </header>
    <div id="hudClock" class="hud__clock">0:00.000</div>
    <div class="hud__grid">
      <div><small>CHECKPOINT</small><b id="hudCheckpoint">0/0</b></div>
      <div><small>LAP</small><b id="hudLap">1/1</b></div>
      <div id="hudPlaceBox"><small>PLACE</small><b id="hudPlace">-</b></div>
      <div><small>BEST LAP</small><b id="hudBestLap">-</b></div>
    </div>
    <div id="hudRecords" class="hud__records">
      <span>PB <b id="hudPb">-</b></span>
      <span>RECORD <b id="hudRecord">-</b></span>
    </div>
    <ol id="hudRows" class="hud__rows"></ol>
    <footer id="hudKeys" class="hud__keys"></footer>
  </section>

  <!-- Loading / countdown / GO in the middle of the screen. -->
  <div id="banner" class="banner" hidden></div>

  <!-- Results card. -->
  <section id="results" class="card results" hidden>
    <header class="card__head"><span class="tag">RESULT</span><span id="resultTitle">Finished</span></header>
    <div id="resultTime" class="results__time">0:00.000</div>
    <div id="resultBadges" class="results__badges"></div>
    <ol id="resultRows" class="results__rows"></ol>
    <p id="resultNote" class="muted"></p>
  </section>

  <!-- Activity panel (/race): focus, mouse. -->
  <section id="panel" class="card panel" hidden>
    <header class="card__head">
      <span class="tag">RACES</span><span>Night City street and rooftop racing</span>
      <button id="panelClose" class="close" title="Close (Esc)">&times;</button>
    </header>
    <p id="panelNote" class="muted"></p>
    <div id="activities" class="activities"></div>
    <h3 class="section">TIME TRIAL COURSES</h3>
    <div id="courses" class="courses"></div>
    <footer class="panel__foot">
      <button id="leaveButton" class="ghost" hidden>Leave</button>
      <button id="startTrial" class="primary">Start time trial</button>
    </footer>
  </section>

  <!-- Staff course editor. -->
  <section id="editor" class="card editor" hidden>
    <header class="card__head"><span class="tag">EDITOR</span><span id="editorName">Course</span></header>
    <div id="editorStats" class="editor__stats"></div>
    <p id="editorMessage" class="muted"></p>
    <footer id="editorKeys" class="hud__keys"></footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
