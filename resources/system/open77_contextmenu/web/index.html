<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open//77 target actions</title>
  <!-- Open//77 RP design system: tokens and self-hosted fonts are copies of the
       gamemode's (each WebUI origin can only load its own files). -->
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="workspace" hidden>
    <!-- TargetEye: four corner brackets around a hex reticle. scan / locked / blocked. -->
    <div id="eye" class="eye" aria-hidden="true">
      <span class="eye__corner eye__corner--tl"></span><span class="eye__corner eye__corner--tr"></span>
      <span class="eye__corner eye__corner--bl"></span><span class="eye__corner eye__corner--br"></span>
      <span class="eye__core"><svg id="eyeGlyph" viewBox="0 0 24 24"></svg></span>
    </div>
    <!-- ContextMenu: one column, accent header (target // distance), rows, description, key legend. -->
    <section id="menu" class="ctx" hidden role="dialog" aria-label="Target actions" aria-modal="true" tabindex="-1">
      <header class="ctx__head">
        <span id="title" class="ctx__title">TARGET</span>
        <span id="tag" class="ctx__tag"></span>
      </header>
      <div id="status" class="ctx__status" role="status" aria-live="polite" hidden></div>
      <div id="actions" class="ctx__rows" role="menu" aria-label="Available actions"></div>
      <div id="desc" class="ctx__desc" hidden></div>
      <footer id="legend" class="ctx__legend">HOLD [ALT] · CLICK A TARGET · ESC CLOSES</footer>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
