<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open//77 Wardrobe</title>
  <!-- Open//77 RP design system: tokens and self-hosted fonts are copies of the
       gamemode's (each WebUI origin can only load its own files). Every id and
       state class below is driven by app.js; the markup is the design's. -->
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<main id="room" hidden>
  <section class="wardrobe drawer" role="dialog" aria-modal="true" aria-labelledby="title">
    <header class="head">
      <div class="head-copy">
        <p class="eyebrow o77-tag">FITTING ROOM</p>
        <h1 id="title">Wardrobe</h1>
      </div>
      <button id="close" class="icon" aria-label="Cancel changes and close"><kbd class="key">ESC</kbd></button>
    </header>
    <div class="identity head-meta"><span id="family" class="readout"></span><span id="saved-state" class="badge">SAVED</span></div>

    <nav class="tabs" aria-label="Clothing mode">
      <button id="equipment-tab" class="selected" aria-pressed="true">Equipment</button>
      <button id="outfits-tab" aria-pressed="false">Outfits <span>07</span></button>
    </nav>

    <div id="outfit-tools" hidden>
      <div id="outfits" class="outfits" aria-label="Saved outfits"></div>
      <div class="name-row"><input id="outfit-name" maxlength="48" aria-label="Outfit name" autocomplete="off"><button id="rename">Rename</button></div>
      <div class="outfit-actions"><button id="wear">Wear outfit</button><button id="capture">Copy worn</button><button id="delete" class="danger">Reset outfit</button></div>
    </div>

    <div id="overlay-banner" class="notice" hidden><span id="overlay-text"></span><button id="disable-overlay">Show equipment</button></div>

    <nav id="slots" class="slots" aria-label="Clothing slot"></nav>

    <div class="search-row">
      <label class="search"><span aria-hidden="true">›</span><input id="search" type="search" placeholder="Search clothing" aria-label="Search clothing" autocomplete="off"></label>
      <button id="filter" aria-pressed="false" aria-label="Show favorites only">ALL CLOTHING</button>
    </div>

    <div class="selection">
      <div><span class="eyebrow readout" id="slot-label">HEADWEAR</span><p id="selected-name">No item equipped</p></div>
      <div class="slot-actions"><button id="inherit" hidden>Use equipment</button><button id="remove">Remove</button></div>
    </div>
    <p class="help" id="semantics">Equipment is what your character wears underneath an outfit.</p>

    <div id="catalogue" class="catalogue" role="list" aria-label="Available clothing"></div>
    <div class="pagination"><button id="previous" aria-label="Previous page">←</button><span id="count" class="readout"></span><button id="next" aria-label="Next page">→</button></div>

    <div id="status" class="status" role="status" aria-live="polite">Select clothing to try it on. Save when your look is ready.</div>
    <footer><button id="cancel" class="btn">Cancel</button><button id="save" class="btn primary" disabled>Save changes</button></footer>
  </section>

  <aside class="preview">
    <div class="preview-caption"><p class="eyebrow o77-tag">PREVIEW</p><h2>Try it on.</h2><p>Nothing is saved until you say so.</p></div>
    <div class="preview-bottom">
      <div id="camera-controls" class="camera-controls"><button id="front">Front</button><button id="rotate-left" aria-label="Rotate camera left">↶</button><button id="rotate-right" aria-label="Rotate camera right">↷</button><button id="back">Back</button></div>
      <div class="shortcuts"><button id="appearance">Edit appearance</button><button id="barber">Barber</button></div>
      <p>The world stays live around you.</p>
    </div>
  </aside>

  <div id="confirm" class="confirm" hidden>
    <section role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <h2 id="confirm-title">DISCARD CHANGES?</h2><p id="confirm-text"></p>
      <div><button id="confirm-no">Keep editing</button><button id="confirm-yes" class="primary">Discard</button></div>
    </section>
  </div>
</main>
<script src="model.js"></script><script src="app.js"></script>
</body>
</html>
