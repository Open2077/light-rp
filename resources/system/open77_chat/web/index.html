<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open//77 Chat</title>
  <!-- Open//77 RP design system: tokens and self-hosted fonts are copies of the
       gamemode's (each WebUI origin can only load its own files). -->
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="chat" class="chat is-empty is-idle" aria-label="Open//77 chat">
    <!-- The log has a fixed height, its newest line always at the bottom edge.
         Closed: bare lines on light plates that hide after a while without activity.
         Open (T): a panel, scrollable, with the composer under it. -->
    <div class="chat__frame">
      <section id="messages" class="chat__log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Chat messages">
        <div id="messageList" class="chat__list"></div>
      </section>
      <div id="emptyState" class="chat__empty" aria-hidden="true">No messages yet. Say something.</div>
      <button id="scrollLatest" class="chat__latest" type="button" hidden><span id="unreadCount">1</span> NEW <span aria-hidden="true">↓</span></button>
    </div>

    <!-- Composer -->
    <section id="composer" class="chat__composer" aria-hidden="true">
      <span class="chat__prompt" aria-hidden="true">›</span>
      <input id="input" maxlength="256" autocomplete="off" spellcheck="false" aria-label="Chat message" placeholder="Say something, or /command">
      <span id="characterCount" class="chat__count">0/256</span>
      <button id="sendButton" class="chat__send" type="button" disabled><kbd class="chat__key chat__key--accent">ENTER</kbd></button>
    </section>

    <!-- Under the composer: the command index while the line starts with "/", else the keys. -->
    <section id="suggestions" class="chat__suggest" aria-label="Command suggestions">
      <div id="suggestionList" class="chat__suggest-list" role="listbox"></div>
    </section>
    <footer class="chat__foot" aria-hidden="true">
      <span><kbd class="chat__key">ESC</kbd>Close</span>
      <span><kbd class="chat__key">TAB</kbd>Complete</span>
      <span><kbd class="chat__key">↑</kbd><kbd class="chat__key">↓</kbd>History</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
