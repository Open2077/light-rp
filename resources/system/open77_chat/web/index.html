<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open//77 Chat</title>
  <!-- Open//77 RP design system: tokens and self-hosted fonts are copies of the
       gamemode's (each WebUI origin can only load its own files). -->
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="chat" class="chat" aria-label="Open//77 chat">
    <!-- Header: only while typing. Tag + link readout + line counter. -->
    <header class="chat__head" aria-hidden="true">
      <span class="chat__tag">OPEN//77 <span class="chat__slash">//</span> CHAT</span>
      <span class="chat__link"><i class="chat__dot" aria-hidden="true"></i>LINK ACTIVE · <span id="messageCount">00</span> LINES</span>
    </header>

    <!-- The log: a HUD readout when closed (fades when idle), a panel when open. -->
    <div class="chat__frame">
      <section id="messages" class="chat__log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Chat messages"></section>
      <div id="emptyState" class="chat__empty" aria-hidden="true"><span class="chat__slash">//</span> NO SIGNAL</div>
      <button id="scrollLatest" class="chat__latest" type="button" hidden><span id="unreadCount">1</span> NEW ↓</button>
    </div>

    <!-- Command index, above the composer while the line starts with "/". -->
    <section id="suggestions" class="chat__suggest" aria-label="Command suggestions">
      <header class="chat__suggest-head">
        <span class="chat__slash">//</span> COMMAND INDEX
        <span id="suggestionCount" class="chat__suggest-count">00 MATCHES</span>
      </header>
      <div id="suggestionList" class="chat__suggest-list" role="listbox"></div>
    </section>

    <!-- Composer -->
    <section id="composer" class="chat__composer" aria-hidden="true">
      <span class="chat__prompt" aria-hidden="true">›</span>
      <input id="input" maxlength="256" autocomplete="off" spellcheck="false" aria-label="Chat message" placeholder="Say something, or /command">
      <span id="characterCount" class="chat__count">000/256</span>
      <button id="sendButton" class="chat__send" type="button" disabled><kbd class="chat__key chat__key--accent">ENTER</kbd></button>
    </section>

    <footer class="chat__foot" aria-hidden="true">
      <span><kbd class="chat__key">ESC</kbd> CLOSE</span>
      <span><kbd class="chat__key">TAB</kbd> COMPLETE</span>
      <span><kbd class="chat__key">↑</kbd><kbd class="chat__key">↓</kbd> HISTORY</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
